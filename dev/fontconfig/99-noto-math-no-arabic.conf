<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Noto Sans Math covers the Arabic block, but only as isolated mathematical
  letterforms: it carries no GSUB joining rules. fontconfig ranks it ahead of
  Noto Sans Arabic, so Arabic labels come out unjoined.

  The font is still needed — linguistic trees use its mathematical alphanumeric
  symbols (U+1D400-, e.g. the little v of vP) — so subtract the Arabic script
  ranges from its charset at scan time instead of rejecting the family. The
  Arabic Mathematical Alphabetic Symbols block (U+1EE00-) is left in place.
-->
<fontconfig>
  <match target="scan">
    <test name="family">
      <string>Noto Sans Math</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0600</int><int>0x06FF</int></range>
          <range><int>0x0750</int><int>0x077F</int></range>
          <range><int>0x08A0</int><int>0x08FF</int></range>
          <range><int>0xFB50</int><int>0xFDFF</int></range>
          <range><int>0xFE70</int><int>0xFEFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
